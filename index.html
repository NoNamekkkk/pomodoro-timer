<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="color-scheme" content="light dark">

<title>Minimal Pomodoro</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="widget">


    <div class="tabs">

        <div class="tab active" id="focusTab">
            Focus
        </div>


        <div class="tab" id="breakTab">
            Break
        </div>


    </div>



    <div class="time" id="time">
        25:00
    </div>



    <div class="controls">


        <button class="icon" id="play">
            ▶
        </button>


        <button class="icon" id="reset">
            ↻
        </button>


    </div>


</div>



<script src="script.js"></script>


</body>

</html>
